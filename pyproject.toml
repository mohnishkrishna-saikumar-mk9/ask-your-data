[project]
name = "ask-your-data"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]
# SIM108 prefers one-line ternaries; an if/else with a comment is easier to explain.
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: integration tests that need a PostgreSQL DATABASE_URL"]
